<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رغودة</title>
<meta name="apple-mobile-web-app-title" content="رغودة">
<meta name="theme-color" content="#7b5cff">
<link rel="manifest" href="ragouda-manifest.json">
<link rel="icon" type="image/png" href="ragouda-192.png">
<link rel="apple-touch-icon" href="ragouda-apple.png">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ea;--card:#fff;--ink:#12263a;--mute:#5d6b78;--line:#d9dfd3;--acc:#b8862b;--hero:#12263a;--hi:#f3ead7;--ok:#2f7d6d;--no:#b5483a}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a27;--card:#16283a;--ink:#eadfc8;--mute:#9aa9b6;--line:#243a50;--acc:#d9a94a;--hero:#0a1520;--ok:#3f9c89;--no:#d46a5a}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;max-width:560px;margin:auto;padding:env(safe-area-inset-top) 0 40px;line-height:1.8}
.hero{background:var(--hero);color:var(--hi);padding:26px 20px 22px;border-radius:0 0 26px 26px}
.hero small{opacity:.75}.hero h1{font-size:32px;line-height:1.3}
.bk{background:none;border:1px solid var(--hi);color:var(--hi);border-radius:99px;padding:2px 14px;font:inherit;font-size:14px;margin-bottom:8px}
main{padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:99px;font:inherit;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.uc{display:flex;gap:14px;align-items:center;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;color:var(--ink);font:inherit}
.uc .ic{font-size:30px}.uc small{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card h3{color:var(--acc);font-size:17px}
.eg{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);font-size:18px}
.ex{unicode-bidi:isolate;display:inline-block}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.3}
.fr i{font-style:normal;padding:0 5px}.fr i:first-child{border-bottom:2px solid currentColor}
.qt{font-size:20px;margin-bottom:12px;text-align:center}
.op{display:block;width:100%;margin-bottom:8px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:20px}
.op.ok{border-color:var(--ok);background:var(--ok);color:#fff}
.op.no{border-color:var(--no);background:var(--no);color:#fff}
.fb{margin:10px 0;font-size:15px}
.btn{font:inherit;border:0;background:var(--acc);color:#fff;padding:10px 22px;border-radius:12px;font-weight:700}
.note{color:var(--mute);font-size:14px;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[R(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const fmt=n=>String(parseFloat(n.toFixed(4)));
const fr=(n,d)=>d===1?""+n:`<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const F=(n,d)=>{const g=gcd(n,d);return fr(n/g,d/g)};
const X=h=>`<span dir="ltr" class="ex">${h}</span>`;
const mn=n=>n<0?"−"+(-n):""+n;
const nf=v=>()=>fmt(Math.max(0,v+R(-6,6)*(v>40?3:1)));
function fin(q,ans,wr,exp,fill){
  const s=new Set([String(ans)]);let w=[];
  wr.forEach(x=>{x=String(x);if(!s.has(x)){s.add(x);w.push(x)}});
  let g=0;while(w.length<3&&g++<60){const x=String(fill());if(!s.has(x)){s.add(x);w.push(x)}}
  const opts=shuf([String(ans),...w.slice(0,3)]);
  return{q,opts,a:opts.indexOf(String(ans)),exp};
}

/* ---------- مولدات الأسئلة ---------- */
const g1=()=>{
  const t=R(0,3);let b=pick([2,3,4,5,6,8]),d=pick([2,3,4,5,6,8]),a=R(1,b-1),c=R(1,d-1);
  if(t===1){if(a*d<c*b)[a,b,c,d]=[c,d,a,b];if(a*d===c*b){a=1;b=2;c=1;d=3}}
  const A=fr(a,b),C=fr(c,d),fl=()=>F(R(1,9),R(2,10)),ab=Math.abs(a-c)||1;
  if(t===0)return fin(X(`${A} + ${C} = ?`),F(a*d+c*b,b*d),[F(a+c,b+d),F(a*c,b*d),F(a+c,b)],"وحّد المقامات ثم اجمع البسطين وبسّط الناتج.",fl);
  if(t===1)return fin(X(`${A} − ${C} = ?`),F(a*d-c*b,b*d),[F(ab,Math.abs(b-d)||1),F(a*c,b*d),F(ab,b)],"وحّد المقامات ثم اطرح البسطين وبسّط الناتج.",fl);
  if(t===2)return fin(X(`${A} × ${C} = ?`),F(a*c,b*d),[F(a+c,b+d),F(a*d,b*c),F(a*c,b+d)],"اضرب البسط في البسط والمقام في المقام ثم بسّط.",fl);
  return fin(X(`${A} ÷ ${C} = ?`),F(a*d,b*c),[F(a*c,b*d),F(b*c,a*d),F(a*d,b*d)],"اقلب الكسر الثاني واضرب، ثم بسّط.",fl);
};
const g2=()=>{const t=R(0,2);
  if(t===0){const a=R(2,15),b=R(2,9),v=a*b/100;return fin(X(`${fmt(a/10)} × ${fmt(b/10)} = ?`),fmt(v),[fmt(v*10),fmt(v/10),fmt(v*100)],"اضرب كأنهما عددان صحيحان، ثم عُدّ المنازل العشرية في العددين.",nf(v))}
  if(t===1){const dv=pick([0.5,0.2,0.25,0.1]),q=R(2,20),v=q*dv;return fin(X(`${fmt(v)} ÷ ${dv} = ?`),fmt(q),[fmt(q*10),fmt(q/10),fmt(q+1)],"حرّك الفاصلة في العددين لليمين حتى يصير المقسوم عليه عددًا صحيحًا.",nf(q))}
  const x=R(11,99)/100,k=pick([10,100,1000]);
  return fin(X(`${x} × ${k} = ?`),fmt(x*k),[fmt(x*k*10),fmt(x*k/10),fmt(x/k)],"الضرب في 10 أو 100 أو 1000 يحرّك الفاصلة لليمين بعدد الأصفار.",nf(x*k));
};
const g3=()=>{const t=R(0,2),k=R(2,6),[p,q]=pick([[2,3],[3,4],[1,2],[3,5],[4,5],[2,5],[5,6]]);
  if(t===0)return fin(`اكتب النسبة ${X(`${p*k} : ${q*k}`)} في أبسط صورة`,`${p}:${q}`,[`${q}:${p}`,`${p*k}:${q}`,`${p+1}:${q}`],"اقسم الحدّين على عامل مشترك أكبر.",()=>`${R(1,6)}:${R(1,6)}`);
  if(t===1)return fin(`النسبة بين عددين ${X(`${p} : ${q}`)}، فإذا كان العدد الأول ${p*k} فما العدد الثاني؟`,q*k,[q*k+p,p*k+q,q+k],"العدد الأول = النسبة × k، فنوجد k ثم نضربها في الحد الثاني.",nf(q*k));
  const n=R(2,6),pr=R(3,9),m=n+R(1,6);
  return fin(`ثمن ${n} أقلام ${n*pr} جنيهات، فما ثمن ${m} أقلام؟`,m*pr,[n*pr+m,m+pr,n*pr],"أوجد ثمن القلم الواحد ثم اضربه في العدد المطلوب.",nf(m*pr));
};
const g4=()=>{const t=R(0,3);
  if(t===0){const x=pick([10,20,25,50,5,15,30]),y=R(1,20)*20,v=x*y/100;return fin(`ما قيمة ${x}% من ${y}؟`,v,[x+y,y/x,v*2],"النسبة المئوية × العدد ÷ 100.",nf(v))}
  if(t===1){const d=pick([2,4,5,10,20,25]),n=R(1,d-1),v=n*100/d;return fin(`حوّل ${X(fr(n,d))} إلى نسبة مئوية`,v+"%",[n+"%",(v/10)+"%",(v*2)+"%"],"اضرب الكسر في 100.",()=>R(1,99)+"%")}
  if(t===2){const pr=R(2,25)*40,p=pick([10,20,25,50]),v=pr*(100-p)/100;return fin(`سعر سلعة ${pr} جنيهًا، خُصم منها ${p}%. ما السعر بعد الخصم؟`,fmt(v),[fmt(pr*p/100),fmt(pr-p),fmt(pr+pr*p/100)],"قيمة الخصم = النسبة × السعر ÷ 100، ثم اطرحها من السعر.",nf(v))}
  const b=pick([4,5,10,20,25,50]),a=R(1,b-1),v=a*100/b;
  return fin(`حصل تلميذ على ${a} من ${b}. ما نسبته المئوية؟`,v+"%",[a+"%",(v/10)+"%",(100-v)+"%"],"النسبة المئوية = (الجزء ÷ الكل) × 100.",()=>R(1,99)+"%");
};
const g5=()=>{const t=R(0,3),a=pick([-9,-8,-7,-6,-5,-4,-3,-2,2,3,4,5,6,7,8,9]),b=pick([-9,-7,-6,-5,-4,-3,-2,2,3,4,5,6,8,9]),nfl=()=>mn(R(-15,15));
  if(t===0)return fin(X(`${mn(a)} + (${mn(b)}) = ?`),mn(a+b),[mn(a-b),mn(-(a+b)),mn(Math.abs(a)+Math.abs(b))],"إشارتان متشابهتان: اجمع وأبقِ الإشارة. مختلفتان: اطرح وخذ إشارة الأكبر.",nfl);
  if(t===1)return fin(X(`${mn(a)} − (${mn(b)}) = ?`),mn(a-b),[mn(a+b),mn(b-a),mn(-(a+b))],"الطرح = جمع العدد المعاكس: a − b = a + (−b).",nfl);
  if(t===2){const tp=R(-5,10),d=R(2,12);return fin(`درجة الحرارة ${mn(tp)}° ثم انخفضت ${d} درجات. كم أصبحت؟`,mn(tp-d)+"°",[mn(tp+d)+"°",mn(d-tp)+"°",mn(-(tp+d))+"°"],"الانخفاض يعني طرح، ونتحرك يسار خط الأعداد.",()=>mn(R(-15,15))+"°")}
  const s=new Set([a,b,R(-9,9)]);while(s.size<3)s.add(R(-9,9));const arr=[...s];
  return fin(`أي الأعداد التالية أصغر؟ ${X(arr.map(mn).join(" ، "))}`,mn(Math.min(...arr)),arr.filter(x=>x!==Math.min(...arr)).map(mn),"الأصغر هو الأبعد جهة اليسار على خط الأعداد.",nfl);
};
const g6=()=>{const t=R(0,3),a=nf(10);
  if(t===0){const r=pick([7,14,21,3.5,10.5]),v=44*r/7;return fin(`محيط دائرة نصف قطرها ${r} سم (π = 22/7)`,fmt(v)+" سم",[fmt(v*r/2)+" سم",fmt(v/2)+" سم",fmt(v*2)+" سم"],"المحيط = 2 × π × نق.",()=>fmt(R(10,200))+" سم")}
  if(t===1){const r=pick([7,14,21,3.5]),v=22/7*r*r;return fin(`مساحة دائرة نصف قطرها ${r} سم (π = 22/7)`,fmt(v)+" سم²",[fmt(2*22/7*r)+" سم²",fmt(v*2)+" سم²",fmt(22/7*r)+" سم²"],"المساحة = π × نق × نق.",()=>fmt(R(10,700))+" سم²")}
  if(t===2){const d=pick([7,14,21,28]),v=22*d/7;return fin(`محيط دائرة قطرها ${d} سم (π = 22/7)`,fmt(v)+" سم",[fmt(v*2)+" سم",fmt(v/2)+" سم",fmt(22/7*d*d/4)+" سم"],"المحيط = π × القطر.",()=>fmt(R(10,200))+" سم")}
  const r=pick([7,14,21,10.5]),c=44*r/7;
  return fin(`دائرة محيطها ${fmt(c)} سم، فما نصف قطرها؟ (π = 22/7)`,fmt(r)+" سم",[fmt(r*2)+" سم",fmt(c/22)+" سم",fmt(c/2)+" سم"],"نق = المحيط ÷ (2 × π).",()=>fmt(R(2,30))+" سم");
};
const g7=()=>{const t=R(0,3),l=R(2,10),w=R(2,8),h=R(2,9),s=R(2,9),k=R(1,9);
  if(t===0)return fin(`حجم متوازي مستطيلات أبعاده ${l} و${w} و${h} سم`,l*w*h+" سم³",[(l*w+h)+" سم³",2*(l*w+w*h+l*h)+" سم³",(l+w+h)+" سم³"],"الحجم = الطول × العرض × الارتفاع.",()=>R(10,500)+" سم³");
  if(t===1)return fin(`حجم مكعب طول حرفه ${s} سم`,s**3+" سم³",[s*s+" سم³",3*s+" سم³",6*s*s+" سم³"],"حجم المكعب = الحرف × الحرف × الحرف.",()=>R(8,800)+" سم³");
  if(t===2)return fin(`المساحة الكلية لمكعب طول حرفه ${s} سم`,6*s*s+" سم²",[s**3+" سم²",4*s*s+" سم²",s*s+" سم²"],"المكعب له 6 أوجه مربعة: المساحة الكلية = 6 × الحرف².",()=>R(10,500)+" سم²");
  return fin(`خزان حجمه ${k*1000} سم³، فكم لترًا يسع؟ (اللتر = 1000 سم³)`,k+" لتر",[k*10+" لتر",k*1000+" لتر",k/10+" لتر"],"اقسم الحجم بالسنتيمتر المكعب على 1000.",()=>R(1,20)+" لتر");
};
const g8=()=>{const t=R(0,3),s=new Set();while(s.size<5)s.add(R(3,25));const a=[...s],sm=a.slice(0,4).reduce((x,y)=>x+y,0);
  if(t===0){let l=R(3,25);while((sm+l)%5)l++;const arr=[...a.slice(0,4),l];return fin(`المتوسط الحسابي للأعداد ${X(shuf(arr).join(" ، "))}`,(sm+l)/5,[sm+l,(sm+l)/4,Math.max(...arr)],"المتوسط = مجموع القيم ÷ عددها.",nf((sm+l)/5))}
  if(t===1){const so=[...a].sort((x,y)=>x-y);return fin(`الوسيط للأعداد ${X(shuf(a).join(" ، "))}`,so[2],[so[1],so[3],so[0]],"رتّب الأعداد ثم خذ القيمة التي في المنتصف.",nf(so[2]))}
  if(t===2){const m=a[0],arr=shuf([...a.slice(1,5),m,m]);return fin(`المنوال للقيم ${X(arr.join(" ، "))}`,m,a.slice(1,4),"المنوال هو القيمة الأكثر تكرارًا.",nf(m))}
  return fin(`المدى للأعداد ${X(shuf(a).join(" ، "))}`,Math.max(...a)-Math.min(...a),[Math.max(...a),Math.min(...a),Math.max(...a)+Math.min(...a)],"المدى = أكبر قيمة − أصغر قيمة.",nf(Math.max(...a)-Math.min(...a)));
};

/* ---------- الوحدات والشرح ---------- */
const U=[
{id:"u1",term:1,ic:"🍕",name:"العمليات على الكسور العادية",gen:g1,ex:[
 {h:"الجمع والطرح",p:"وحّد المقامات أولًا، ثم اجمع أو اطرح البسطين.",e:X(`${fr(1,2)} + ${fr(1,3)} = ${fr(3,6)} + ${fr(2,6)} = ${fr(5,6)}`)},
 {h:"الضرب",p:"بسط × بسط، ومقام × مقام، ثم بسّط الناتج.",e:X(`${fr(2,3)} × ${fr(3,4)} = ${fr(6,12)} = ${fr(1,2)}`)},
 {h:"القسمة",p:"اقلب الكسر الثاني (المقلوب) وحوّل القسمة إلى ضرب.",e:X(`${fr(1,2)} ÷ ${fr(1,4)} = ${fr(1,2)} × ${fr(4,1)} = 2`)}]},
{id:"u2",term:1,ic:"🔢",name:"الكسور العشرية",gen:g2,ex:[
 {h:"ضرب الكسور العشرية",p:"اضرب الأعداد كأنها صحيحة، ثم ضع الفاصلة بعدد المنازل العشرية في العددين معًا.",e:X("1.2 × 0.3 → 12 × 3 = 36 → 0.36")},
 {h:"القسمة على كسر عشري",p:"حرّك الفاصلة في المقسوم والمقسوم عليه لنفس العدد من المنازل.",e:X("4.5 ÷ 0.5 = 45 ÷ 5 = 9")},
 {h:"الضرب في 10 و100 و1000",p:"تتحرك الفاصلة لليمين بعدد الأصفار.",e:X("0.35 × 100 = 35")}]},
{id:"u3",term:1,ic:"⚖️",name:"النسبة والتناسب",gen:g3,ex:[
 {h:"النسبة",p:"مقارنة بين كميتين من نفس النوع، ونكتبها في أبسط صورة بالقسمة على عامل مشترك.",e:X("12 : 18 = 2 : 3")},
 {h:"التناسب",p:"تساوي نسبتين. حاصل ضرب الطرفين = حاصل ضرب الوسطين.",e:X(`2 : 3 = 8 : 12 ← 2 × 12 = 3 × 8`)},
 {h:"طريقة الوحدة",p:"أوجد قيمة الواحد ثم اضرب في العدد المطلوب.",e:"5 أقلام بـ 20 جنيهًا ← القلم 4 جنيهات ← 8 أقلام = 32 جنيهًا"}]},
{id:"u4",term:1,ic:"💯",name:"النسبة المئوية",gen:g4,ex:[
 {h:"معنى النسبة المئوية",p:"كسر مقامه 100. نحوّل الكسر بضربه في 100.",e:X(`${fr(3,5)} × 100 = 60%`)},
 {h:"إيجاد جزء من عدد",p:"النسبة ÷ 100 × العدد.",e:X("25% من 80 = 25 ÷ 100 × 80 = 20")},
 {h:"الخصم",p:"قيمة الخصم = النسبة × السعر، والسعر بعد الخصم = السعر − الخصم.",e:"سعر 200 جنيه وخصم 15% ← الخصم 30 ← السعر الجديد 170"}]},
{id:"u5",term:2,ic:"🌡️",name:"الأعداد الصحيحة",gen:g5,ex:[
 {h:"خط الأعداد",p:"الأعداد الموجبة على يمين الصفر والسالبة على يساره، وكلما اتجهنا لليمين زاد العدد.",e:X("−5 < −2 < 0 < 3")},
 {h:"الجمع",p:"متشابهتا الإشارة: اجمع وأبقِ الإشارة. مختلفتا الإشارة: اطرح الأصغر من الأكبر وخذ إشارة الأكبر.",e:X("(−3) + (−4) = −7 ، (−8) + 5 = −3")},
 {h:"الطرح",p:"اطرح = اجمع العدد المعاكس.",e:X("5 − (−3) = 5 + 3 = 8")}]},
{id:"u6",term:2,ic:"⭕",name:"محيط الدائرة ومساحتها",gen:g6,ex:[
 {h:"المحيط",p:"π تساوي 22/7 أو 3.14. المحيط = 2 × π × نق = π × القطر.",e:X("نق = 7 ← المحيط = 2 × 22/7 × 7 = 44 سم")},
 {h:"المساحة",p:"المساحة = π × نق × نق.",e:X("نق = 7 ← المساحة = 22/7 × 49 = 154 سم²")},
 {h:"تذكر",p:"نق = القطر ÷ 2. ووحدة المحيط سم، ووحدة المساحة سم².",e:""}]},
{id:"u7",term:2,ic:"📦",name:"حجوم المجسمات",gen:g7,ex:[
 {h:"متوازي المستطيلات",p:"الحجم = الطول × العرض × الارتفاع.",e:X("5 × 4 × 3 = 60 سم³")},
 {h:"المكعب",p:"الحجم = الحرف³، والمساحة الكلية = 6 × الحرف².",e:X("حرف 3: الحجم 27 سم³، المساحة 54 سم²")},
 {h:"السعة",p:"اللتر الواحد = 1000 سم³.",e:"خزان 5000 سم³ يسع 5 لترات"}]},
{id:"u8",term:2,ic:"📊",name:"الإحصاء",gen:g8,ex:[
 {h:"المتوسط الحسابي",p:"مجموع القيم ÷ عددها.",e:X("(4 + 6 + 8) ÷ 3 = 6")},
 {h:"الوسيط والمنوال",p:"الوسيط هو القيمة الوسطى بعد الترتيب. المنوال هو القيمة الأكثر تكرارًا.",e:X("3 ، 5 ، 7 ، 7 ، 9 ← الوسيط 7 ، المنوال 7")},

function renderQ(el,q,onAns,onNext,label){
  el.innerHTML=`<div class="card"><div class="qt">${q.q}</div>${q.opts.map((o,i)=>`<button class="op" data-i="${i}">${q.t?o:X(o)}</button>`).join("")}<div class="fb"></div></div>`;
  let done=false;const bs=el.querySelectorAll(".op");
  bs.forEach(b=>b.onclick=()=>{
    if(done)return;done=true;const ok=+b.dataset.i===q.a;
    bs[q.a].classList.add("ok");if(!ok)b.classList.add("no");
    el.querySelector(".fb").innerHTML=`<b>${ok?"إجابة صحيحة، أحسنت!":"الصحيحة باللون الأخضر."}</b><br>${q.exp}<br><br><button class="btn">${label}</button>`;
    el.querySelector(".btn").onclick=onNext;onAns(ok);
  });
}
function practice(gen,el){
  let s=0,n=0;el.innerHTML='<p class="note" id="sc">حل بقدر ما تحب، الأسئلة لا تنتهي.</p><div id="q"></div>';
  const next=()=>renderQ($("#q"),gen(),ok=>{n++;if(ok)s++;$("#sc").textContent=`إجاباتك الصحيحة: ${s} من ${n}`},next,"سؤال جديد");
  next();
}
function quiz(gens,total,key,el){
  let i=0,s=0;
  const step=()=>{
    if(i>=total)return finish();
    el.innerHTML=`<p class="note">سؤال ${i+1} من ${total}</p><div id="q"></div>`;
    renderQ($("#q"),pick(gens)(),ok=>{if(ok)s++},()=>{i++;step()},i===total-1?"إنهاء":"التالي");
  };
  const finish=()=>{
    const p=Math.round(s*100/total);prog[key]=Math.max(prog[key]||0,p);save();
    el.innerHTML=`<div class="card" style="text-align:center;padding:24px"><div style="font-size:44px">${["😊","⭐","⭐⭐","🌟🌟🌟"][stars(p)]}</div><h2>${s} من ${total}</h2><p>${p>=90?"ممتاز! أنت بطل الرياضيات":p>=70?"جيد جدًا، كمّل":p>=50?"محاولة جيدة، جرّب مرة ثانية":"راجع الشرح وحاول من جديد"}</p><br><button class="btn" id="again">إعادة الاختبار</button></div>`;
    $("#again").onclick=()=>quiz(gens,total,key,el);
  };
  step();
}

function home(){
  $("#app").innerHTML=`<header class="hero"><small>يلا نذاكر ونكسب نجوم</small><h1>رغودة</h1></header><main>
  <div class="tabs">${SUBJ.map(x=>`<button class="chip ${x[0]===subj?"on":""}" data-s="${x[0]}">${x[2]} ${x[1]}</button>`).join("")}</div>
  ${subj==="math"?`<div class="tabs">${[1,2].map(t=>`<button class="chip ${t===term?"on":""}" data-t="${t}">الفصل ${t===1?"الأول":"الثاني"}</button>`).join("")}</div>`:""}
  ${list().map(u=>`<button class="uc" data-u="${u.id}"><span class="ic">${u.ic}</span><span><b>${u.name}</b><br><small>${st(u.id)}</small></span></button>`).join("")}
  <button class="uc" data-x="1"><span class="ic">🏆</span><span><b>${etitle()}</b><br><small>${st(ekey())}</small></span></button></main>`;
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{subj=b.dataset.s;home()});
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{term=+b.dataset.t;home()});
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>unit(U.find(u=>u.id===b.dataset.u),"s"));
  $("[data-x]").onclick=exam;
}
function shell(title){
  $("#app").innerHTML=`<header class="hero"><button class="bk" id="bk">رجوع</button><h1>${title}</h1></header><main id="m"></main>`;
  $("#bk").onclick=home;
}
function unit(u,tab){
  shell(u.name);
  $("#m").innerHTML=`<div class="tabs">${[["s","الشرح"],["p","تمارين"],["q","اختبار"]].map(t=>`<button class="chip ${t[0]===tab?"on":""}" data-k="${t[0]}">${t[1]}</button>`).join("")}</div><div id="b"></div>`;
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>unit(u,b.dataset.k));
  const el=$("#b");
  if(tab==="s")el.innerHTML=u.ex.map(e=>`<div class="card"><h3>${e.h}</h3><p>${e.p}</p>${e.e?`<div class="eg">${e.e}</div>`:""}</div>`).join("")+'<p class="note">جاهز؟ انتقل إلى تمارين.</p>';
  if(tab==="p")practice(u.gen,el);
  if(tab==="q")quiz([u.gen],u.subj==="math"?8:5,u.id,el);
}
function exam(){
  shell(etitle());
  quiz(list().map(u=>u.gen),10,ekey(),$("#m"));
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
home();
</script>
</body>
</html>
